<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>HugoSMP Playercount Overlay</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden}
  svg{display:block;shape-rendering:crispEdges}
  #overlay{
    position:relative;overflow:hidden;
    display:inline-flex;align-items:center;gap:12px;
    padding:10px 14px 10px 10px;margin:2px;border-radius:14px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(36,13,50,var(--a,.88));
  }
  #overlay>:not(#stars):not(#fw){position:relative;z-index:1}
  #stars{position:absolute;inset:0;z-index:0;pointer-events:none}
  .star{position:absolute;background:#fff;
        animation:drift var(--d) ease-in-out infinite alternate,twinkle var(--t) ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
  @keyframes twinkle{from{opacity:.12}to{opacity:var(--o)}}
  #logo{display:block;height:44px}
  #info{display:flex;flex-direction:column;align-items:center;gap:6px}
  #box{display:flex;align-items:center;gap:8px;padding:4px 10px 5px 8px;
       box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.2)}
  #count{display:flex}
  .slot{position:relative;overflow:hidden}
  .slot svg{position:absolute;left:0;top:0}
  #dot{animation:pulse 1.6s ease-in-out infinite;transform-origin:center}
  #dot.off{animation:none}
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:1;filter:drop-shadow(0 0 2px rgba(255,30,20,.5))}
    50%{transform:scale(1.15);opacity:.75;filter:drop-shadow(0 0 6px rgba(255,30,20,.95))}
  }
  #fw{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5}
</style>
</head>

function rect(svg,x,y,w,h,fill){
  const r=document.createElementNS(NS,"rect");
  r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);
  r.setAttribute("fill",fill);
  svg.appendChild(r);
}

/* Roter 4x4-Kreis ohne Ecken, mit dunklem Rand */
function drawDot(online){
  const svg=document.getElementById("dot"), s=DOT_SCALE, o=2;
  svg.innerHTML="";
  svg.setAttribute("width",4*s+2*o);svg.setAttribute("height",4*s+2*o);
  svg.classList.toggle("off",!online);
  const cells=[];
  for(let y=0;y<4;y++)for(let x=0;x<4;x++){
    if((x===0||x===3)&&(y===0||y===3))continue;
    cells.push([x,y]);
  }
  const c = online ? ["#ff2a1a","#e00000","#9a0000"] : ["#9a9a9a","#777","#4a4a4a"];
  cells.forEach(([x,y])=>rect(svg,x*s,y*s,s+2*o,s+2*o,"#1a0824"));
  cells.forEach(([x,y])=>rect(svg,o+x*s,o+y*s,s,s,y===0?c[0]:y===3?c[2]:c[1]));
}

/* Kleiner Text über der Zahl */
function drawLabel(){
  const svg=document.getElementById("label"), s=LABEL_SCALE, str=LABEL.toUpperCase();
  svg.innerHTML="";
  if(!str){svg.style.display="none";return;}
  svg.setAttribute("width",str.length*6*s-s);svg.setAttribute("height",7*s);
  [...str].forEach((ch,i)=>{
    (GLYPHS[ch]||GLYPHS["?"]).forEach((row,y)=>[...row].forEach((v,x)=>{
      if(v==="1") rect(svg,(i*6+x)*s,y*s,s,s,LABEL_COLOR);
    }));
  });
}

/* Zahlen-Ziffer als SVG (mit Schatten) */
const GAP=1;
function glyph(ch){
  const s=TEXT_SCALE, svg=document.createElementNS(NS,"svg");
  svg.setAttribute("width",(5+GAP)*s);svg.setAttribute("height",8*s);
  const g=GLYPHS[ch]||GLYPHS["?"];
  (SHADOW_COLOR?[[s,s,SHADOW_COLOR],[0,0,TEXT_COLOR]]:[[0,0,TEXT_COLOR]]).forEach(([ox,oy,col])=>{
    g.forEach((row,y)=>[...row].forEach((v,x)=>{
      if(v==="1") rect(svg,ox+x*s,oy+y*s,s,s,col);
    }));
  });
  return svg;
}

/* Zahl mit Rollen-Animation (Ziffer für Ziffer) */
const box=document.getElementById("count");
let slots=[];
function makeSlot(){
  const el=document.createElement("div");
  el.className="slot";
  el.style.width=(5+GAP)*TEXT_SCALE+"px";
  el.style.height=8*TEXT_SCALE+"px";
  return {el,ch:null};
}
function roll(slot,ch,dir){
  const H=8*TEXT_SCALE+2, el=slot.el;
  while(el.children.length>1) el.firstChild.remove();
  const old=el.firstChild, neu=glyph(ch);
  el.appendChild(neu);
  slot.ch=ch;
  if(!dir){ if(old) old.remove(); return; }
  const opt={duration:ROLL_MS,easing:"cubic-bezier(.2,.8,.2,1)",fill:"both"};
  // mehr Spieler: alte Ziffer nach unten, neue von oben. Weniger: umgekehrt.
  const from = dir>0 ? -H : H;
  neu.animate([{transform:`translateY(${from}px)`},{transform:"translateY(0)"}],opt);
  if(old){
    const a=old.animate([{transform:"translateY(0)"},{transform:`translateY(${-from}px)`}],opt);
    a.onfinish=()=>old.remove();
  }
}
function setText(str,dir){
  const chars=[...str];
  while(slots.length<chars.length){ const s=makeSlot(); box.insertBefore(s.el,box.firstChild); slots.unshift(s); }
  while(slots.length>chars.length){ slots.shift().el.remove(); }
  chars.forEach((ch,i)=>{ if(slots[i].ch!==ch) roll(slots[i],ch,dir); });
}

/* ===== Feuerwerk (Pixel-Raketen, nur innerhalb des Overlays) ===== */
const fwCanvas=document.getElementById("fw"), fctx=fwCanvas.getContext("2d");
const FW_COLORS=[["#ff3b2f","#ff9a3d"],["#b84cff","#f0b8ff"],["#ffd84a","#fff3a8"],["#ffffff","#bfe9ff"],["#3dd6ff","#b8f1ff"]];
let fwActive=false, fwEnd=0, fwLast=0, fwNext=0, rockets=[], sparks=[];
function startFireworks(){
  fwEnd=performance.now()+FIREWORK_SECONDS*1000;
  if(fwActive) return;
  fwActive=true; fwLast=performance.now(); fwNext=0;
  requestAnimationFrame(fwFrame);
}
function launchRocket(W,H){
  const flight=.7+Math.random()*.35, ty=H*(.12+Math.random()*.4);
  rockets.push({x:W*(.1+Math.random()*.8),y:H,vy:-(H-ty)/flight,ty,col:FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)]});
}
function burst(r,H){
  const R=Math.max(26,Math.min(H*.5,90))*(.8+Math.random()*.4), n=36+Math.floor(Math.random()*14);
  for(let i=0;i<n;i++){
    const ang=Math.PI*2*i/n+Math.random()*.2, sp=R*2.2*(.55+Math.random()*.45);
    sparks.push({x:r.x,y:r.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:.9+Math.random()*.6,age:0,size:Math.random()<.5?3:2,col:r.col[i%2]});
  }
}
function fwFrame(now){
  const ov=document.getElementById("overlay"), W=ov.clientWidth, H=ov.clientHeight;
  if(fwCanvas.width!==W||fwCanvas.height!==H){fwCanvas.width=W;fwCanvas.height=H;}
  const dt=Math.min(.05,(now-fwLast)/1000); fwLast=now;
  fctx.clearRect(0,0,W,H);
  const fade=Math.max(0,Math.min(1,1-(now-fwEnd)/400));   // nach Ende kurz ausblenden
  if(now<fwEnd-1200 && now>=fwNext){ launchRocket(W,H); if(Math.random()<.4) launchRocket(W,H); fwNext=now+350+Math.random()*350; }
  rockets=rockets.filter(r=>{
    r.y+=r.vy*dt;
    if(Math.random()<.8) sparks.push({x:r.x,y:r.y,vx:0,vy:20,life:.35,age:0,size:2,col:"#ffd84a"});
    fctx.fillStyle="#ffffff"; fctx.fillRect(Math.round(r.x),Math.round(r.y),2,3);
    if(r.y<=r.ty){ burst(r,H); return false; }
    return true;
  });
  sparks=sparks.filter(s=>{
    s.age+=dt; if(s.age>=s.life) return false;
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vx*=Math.pow(.12,dt); s.vy=s.vy*Math.pow(.12,dt)+90*dt;
    fctx.globalAlpha=(1-Math.pow(s.age/s.life,2))*fade; fctx.fillStyle=s.col;
    fctx.fillRect(Math.round(s.x),Math.round(s.y),s.size,s.size);
    return true;
  });
  fctx.globalAlpha=1;
  if(now<fwEnd+400) requestAnimationFrame(fwFrame);
  else { fwActive=false; rockets=[]; sparks=[]; fctx.clearRect(0,0,W,H); }
}

/* ===== Zahl anwenden ===== */
let lastCount=null, wasAbove=null;
function applyCount(n,max){
  const dir = lastCount===null ? 0 : Math.sign(n-lastCount);
  drawDot(true);
  setText(SHOW_MAX? n+"/"+max : String(n), dir);
  lastCount=n;
  if(FIREWORK_AT>0){
    const above=n>=FIREWORK_AT;
    if(above && wasAbove!==true && (wasAbove===false || FIREWORK_ON_LOAD)) startFireworks();
    wasAbove=above;
  }
}
async function update(){
  try{
    const r=await fetch("https://api.mcstatus.io/v2/status/java/"+SERVER,{cache:"no-store"});
    const d=await r.json();
    if(d.online){
      applyCount(d.players.online,d.players.max);
    }else{
      drawDot(false); setText("0",0); lastCount=null;
    }
  }catch(e){
    drawDot(false); setText("-",0); lastCount=null;
  }
}

document.documentElement.style.setProperty("--a",BG_OPACITY);

  }
})();
document.getElementById("box").style.background=BOX_COLOR;
document.getElementById("logo").style.display=SHOW_LOGO?"block":"none";
drawLabel(); drawDot(false); setText("-",0);
update(); setInterval(update,REFRESH_S*1000);
